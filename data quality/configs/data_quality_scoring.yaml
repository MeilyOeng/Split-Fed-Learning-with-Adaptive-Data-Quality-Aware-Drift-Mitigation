frequency: "1h"

clients:
  selected: []

validity:
  lower_bound: 0.0
  upper_bound:
  upper_multiplier: 1.5

consistency:
  freeze_min_len: 6
  freeze_atol: 0.0
  rate_of_change_threshold:
  roc_multiplier: 1.5

accuracy:
  local_anomaly_method: seasonal_naive
  rolling_window: 24
  min_history: 6
  mad_multiplier: 4.0
  min_threshold_abs: 0.1
  seasonal_period: 24
  seasonal_threshold_multiplier: 3.0
  allowed_noise_ratio: 2.0
  epsilon: 1.0e-6

freshness:
  staleness_tau: "48h"
  window_recency_span: "168h"
  reporting_delay_enabled: false
  reporting_delay_tau: "24h"
  reporting_reference_time:

subcheck_weights:
  completeness:
    C1: 1.0
    C2: 1.0
    C3: 1.0
  validity:
    V1: 1.0
    V2: 1.0
    V3: 1.0
    V4: 1.0
  consistency:
    CS1: 1.0
    CS2: 1.0
    CS3: 1.0
    CS4: 1.0
    CS5: 1.0
  accuracy:
    A1: 1.0
    A2: 1.0
    A3: 1.0
  freshness:
    F1: 1.0
    F2: 1.0
    F3: 1.0

final_score:
  # method: pca keeps the historical global PCA/min-max score.
  # method: average computes a client/window-local weighted mean of the five dimensions.
  method: average
  dimension_weights:
    completeness: 1.0
    validity: 1.0
    consistency: 1.0
    accuracy: 1.0
    freshness: 1.0

pca:
  epsilon: 1.0e-9
