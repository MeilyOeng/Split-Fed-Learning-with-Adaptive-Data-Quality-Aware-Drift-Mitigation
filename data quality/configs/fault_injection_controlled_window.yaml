# Controlled, stratified window-level fault injection.
# Existing simple/detailed modes are unchanged unless fault_mode is set to controlled_window.

fault_mode: controlled_window
seed: 42

window_faulting:
  window_size: 24
  stride: 1
  sampling_scope: per_cluster_per_client
  total_faulty_window_fraction: 0.35

  dimension_window_fractions:
    completeness: 0.10
    consistency: 0.10
    accuracy: 0.05
    validity: 0.05
    mixed: 0.05

  min_faults_per_faulty_window: 1
  max_faults_per_faulty_window: 2
  multi_fault_probability: 0.15

# Optional: set this to override the default sidecar summary path.
# By default, report path fault_injection_report.csv writes fault_injection_report_summary.csv.
# controlled_window_summary_path: dataset/run_2/quality_output/fault_injection_report_summary.csv
# controlled_selected_clients_path: dataset/run_2/quality_output/selected_clients.csv

clients:
  # selection_mode: all | explicit | global_random | per_cluster_random
  # For thesis coverage experiments, prefer per_cluster_random with explicit random_count
  # so selected clients are nested by deterministic rank for the same seed.
  selection_mode: per_cluster_random
  selected: []
  random_count: 8
  # random_fraction: 0.40
  rounding: round
  min_count_per_cluster: 1
  include_unassigned: false

# Used by per_cluster_random and to populate cluster_id in the manifest/summary.
cluster_assignment:
  path: dataset/cluster-assignment.csv
  client_id_column: ID
  cluster_id_column: Cluster

faults:
  completeness:
    random_missing_rate: 0.0
    block_missing:
      min_length: 1
      max_length: 3

  consistency:
    lag_choices: [1, 2, 24]
    jump_multiplier: 6.0

  accuracy:
    spike_multiplier: 4.0
    noise_std_fraction: 0.05

  validity:
    high_multiplier: 3.0

restore_expected_timestamps_after_injection: true
