# If fault_fraction is set, use simple mode.
# If empty/null, use detailed mode under faults:/drift:.
fault_fraction:

# Simple mode only: possible fault types and their probabilities.
simple_fault_types: [missing, invalid_high, negative_value, replayed_value]
simple_fault_probabilities:

# Simple mode severity settings.
